<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<!-- CDN de Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body class="section">
  <div class="container is-max-desktop">
    <h1 class="title">Analizando archivos con AWS</h1>

    <div class="box">
      <form action="" id="uploadForm">
        <div class="field">
          <label class="label" for="imagen">Seleccione imagen</label>
          <div class="control">
            <input class="input" type="file" name="imagen" id="imagen" accept="image/*" required>
          </div>
        </div>
        <button class="button is-primary mt-2" type="submit">Enviar</button>
      </form>
    </div>

    <div class="box">
      <h3 class="subtitle">Resultados de análisis</h3>
      <ul id="listaEtiquetas" class="content"></ul>
    </div>
  </div>

  <script>
    const form = document.getElementById("uploadForm")
    const listaEtiquetas = document.getElementById("listaEtiquetas")

    form.addEventListener("submit", async (e) => {
      e.preventDefault() //Detener el envio

      //FormData = contenedor de datos
      const formData = new FormData(form)

      listaEtiquetas.innerHTML = `<li>Analizando imagen con AWS...</li>`

      //Enviar los datos por el API...
      try {
        const response = await fetch('/api/analizar', {
          method: 'POST',
          body: formData
        })
        //El servicio de AWS empezará a iniciar la solución...

        const data = await response.json()

        if (data.success) {
          listaEtiquetas.innerHTML = ''
          data.labels.forEach(label => {
            const li = document.createElement("li")
            li.innerHTML = `Imagen: ${label.Name} - confianza: ${label.Confidence}`
            listaEtiquetas.appendChild(li)
          })
        } else {
          //CUIDADO: no se deben exponer TODOS LOS ERRORES
          //¿Cómo se manejan los errores en backend?
          listaEtiquetas.innerHTML = `
            <li>${data.error}</li>
            <li>${data.details}</li>
            <li>${data.code}</li>
          `
        }

      } catch (error) {
        console.error(error)
        listaEtiquetas.innerHTML = `<li>Error de conexión</li>`
      }
    })
  </script>
</body>
</html>
